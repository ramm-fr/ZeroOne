<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroOne - Profile Setup</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Syne & Space Grotesk - High-end Editorial Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="toast.js"></script>
    
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0c0c0c;
            overflow: hidden;
        }
        .heading-font {
            font-family: 'Syne', sans-serif;
        }
        .input-box:focus-within .lucide {
            transform: scale(1.15);
            color: #ffffff;
        }
        .lucide {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.25s ease;
        }
        .avatar-option {
            transition: all 0.2s ease;
        }
        .avatar-option:hover {
            transform: scale(1.05);
        }
        .avatar-option.selected {
            border-color: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="w-screen h-screen max-h-screen text-zinc-100 flex items-center justify-center m-0 p-0 select-none bg-[#0c0c0c]">

    <div class="w-full max-w-5xl mx-auto h-full flex flex-col p-6 md:p-10">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 flex-shrink-0">
            <div class="flex items-center gap-3">
                <span class="heading-font text-xl font-extrabold tracking-tighter text-white">ZeroOne</span>
            </div>
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col md:flex-row gap-6 overflow-hidden">
            
            <!-- Left Panel: Form -->
            <div class="flex-1 bg-[#111111] rounded-2xl p-6 flex flex-col overflow-hidden">
                <div class="space-y-2 mb-6">
                    <h1 class="heading-font text-2xl font-extrabold tracking-tight text-white leading-none">
                        PROFILE SETUP
                    </h1>
                    <p class="text-[10px] tracking-wide text-zinc-500 uppercase">Configure your identity node</p>
                </div>

                <form id="profile-form" class="space-y-4 flex-1 overflow-y-auto pr-2" onsubmit="event.preventDefault(); saveProfile();">
                    
                    <!-- Display Name -->
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-zinc-500">Display Name</label>
                        <div class="input-box relative flex items-center border-b border-zinc-800 focus-within:border-white transition-colors duration-300 py-2">
                            <input type="text" id="display-name" required autocomplete="off"
                                class="w-full bg-transparent text-sm text-white placeholder-zinc-700 focus:outline-none pr-8"
                                placeholder="Enter your display name">
                            <i data-lucide="user" class="absolute right-0 w-4 h-4 text-zinc-600"></i>
                        </div>
                    </div>

                    <!-- Gender -->
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-zinc-500">Gender</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="gender" value="male" class="hidden peer">
                                <div class="border border-zinc-800 peer-checked:border-white peer-checked:bg-zinc-800/50 text-center py-2 text-xs text-zinc-400 peer-checked:text-white transition-all rounded">
                                    Male
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="gender" value="female" class="hidden peer">
                                <div class="border border-zinc-800 peer-checked:border-white peer-checked:bg-zinc-800/50 text-center py-2 text-xs text-zinc-400 peer-checked:text-white transition-all rounded">
                                    Female
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="gender" value="other" class="hidden peer">
                                <div class="border border-zinc-800 peer-checked:border-white peer-checked:bg-zinc-800/50 text-center py-2 text-xs text-zinc-400 peer-checked:text-white transition-all rounded">
                                    Other
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Bio -->
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-zinc-500">Bio</label>
                        <div class="input-box relative flex items-start border-b border-zinc-800 focus-within:border-white transition-colors duration-300 py-2">
                            <textarea id="bio" rows="2" required
                                class="w-full bg-transparent text-sm text-white placeholder-zinc-700 focus:outline-none pr-8 resize-none"
                                placeholder="Tell us about yourself..."></textarea>
                        </div>
                    </div>

                    <!-- Social Links -->
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-zinc-500">Social Links</label>
                        <div class="space-y-2">
                            <div class="input-box relative flex items-center border-b border-zinc-800 focus-within:border-white transition-colors duration-300 py-2">
                                <input type="url" id="twitter-link" autocomplete="off"
                                    class="w-full bg-transparent text-sm text-white placeholder-zinc-700 focus:outline-none pr-8"
                                    placeholder="Twitter URL">
                                <i data-lucide="twitter" class="absolute right-0 w-4 h-4 text-zinc-600"></i>
                            </div>
                            <div class="input-box relative flex items-center border-b border-zinc-800 focus-within:border-white transition-colors duration-300 py-2">
                                <input type="url" id="linkedin-link" autocomplete="off"
                                    class="w-full bg-transparent text-sm text-white placeholder-zinc-700 focus:outline-none pr-8"
                                    placeholder="LinkedIn URL">
                                <i data-lucide="linkedin" class="absolute right-0 w-4 h-4 text-zinc-600"></i>
                            </div>
                            <div class="input-box relative flex items-center border-b border-zinc-800 focus-within:border-white transition-colors duration-300 py-2">
                                <input type="url" id="github-link" autocomplete="off"
                                    class="w-full bg-transparent text-sm text-white placeholder-zinc-700 focus:outline-none pr-8"
                                    placeholder="GitHub URL">
                                <i data-lucide="github" class="absolute right-0 w-4 h-4 text-zinc-600"></i>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Right Panel: Avatar Selection -->
            <div class="w-full md:w-80 bg-[#111111] rounded-2xl p-6 flex flex-col">
                <div class="space-y-2 mb-6">
                    <h2 class="heading-font text-xl font-extrabold tracking-tight text-white leading-none">
                        SELECT AVATAR
                    </h2>
                    <p class="text-[10px] tracking-wide text-zinc-500 uppercase">Choose your visual identity</p>
                </div>

                <!-- Avatar Grid (4 options) -->
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="avatar-option cursor-pointer rounded-xl border-2 border-zinc-800 overflow-hidden aspect-square bg-zinc-900/50 flex items-center justify-center p-2" onclick="selectAvatar(this, 'avatar1')">
                        <img src="svg/Untitled design.svg" class="w-full h-full object-contain" alt="Avatar 1">
                    </div>
                    <div class="avatar-option cursor-pointer rounded-xl border-2 border-zinc-800 overflow-hidden aspect-square bg-zinc-900/50 flex items-center justify-center p-2" onclick="selectAvatar(this, 'avatar2')">
                        <img src="svg/Untitled design (1).svg" class="w-full h-full object-contain" alt="Avatar 2">
                    </div>
                    <div class="avatar-option cursor-pointer rounded-xl border-2 border-zinc-800 overflow-hidden aspect-square bg-zinc-900/50 flex items-center justify-center p-2" onclick="selectAvatar(this, 'avatar3')">
                        <img src="svg/Untitled design (2).svg" class="w-full h-full object-contain" alt="Avatar 3">
                    </div>
                    <div class="avatar-option cursor-pointer rounded-xl border-2 border-zinc-800 overflow-hidden aspect-square bg-zinc-900/50 flex items-center justify-center p-2" onclick="selectAvatar(this, 'avatar4')">
                        <img src="svg/Untitled design (3).svg" class="w-full h-full object-contain" alt="Avatar 4">
                    </div>
                </div>

                <!-- User ID Display -->
                <div class="p-4 bg-zinc-900/30 rounded-xl border border-zinc-800 mb-4">
                    <div class="text-center">
                        <p class="text-[10px] uppercase tracking-widest text-zinc-500 mb-2">Your Unique ID</p>
                        <div id="user-id-display" class="text-3xl font-mono font-bold text-white tracking-widest">
                            ------
                        </div>
                        <p class="text-[9px] text-zinc-600 mt-2">Keep this ID secure</p>
                    </div>
                </div>

                <!-- Submit Button -->
                <button onclick="saveProfile()" 
                    class="w-full bg-white hover:bg-zinc-200 text-black font-medium text-xs tracking-[0.2em] uppercase h-10 transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer flex-shrink-0 sticky bottom-0">
                    <span>Complete Setup</span>
                    <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // ── Supabase ──────────────────────────────────────────────────
        const SUPABASE_URL     = 'https://belblvybuefysawyoocv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlbGJsdnlidWVmeXNhd3lvb2N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTgyMDAsImV4cCI6MjA5NTkzNDIwMH0.F7udCTa8bbmSiNg0Qx_xMZX7mrl-JifU44SSKvRQSk4';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedAvatar = null;
        let uniqueUserId   = null;

        const AVATAR_GRADIENTS = {
            avatar1: { from: '#a855f7', to: '#ec4899', label: 'Purple / Pink'   },
            avatar2: { from: '#3b82f6', to: '#06b6d4', label: 'Blue / Cyan'     },
            avatar3: { from: '#22c55e', to: '#10b981', label: 'Green / Emerald' },
            avatar4: { from: '#f97316', to: '#ef4444', label: 'Orange / Red'    },
        };

        // ── Generate & display UID ────────────────────────────────────
        function generateUniqueId() {
            return (Math.floor(Math.random() * 900000) + 100000).toString();
        }

        async function initUserId() {
            // Check if there's already a logged-in session with an existing profile
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                const { data: existing } = await db
                    .from('profiles')
                    .select('uid')
                    .eq('id', session.user.id)
                    .single();
                if (existing?.uid) {
                    uniqueUserId = existing.uid;
                    document.getElementById('user-id-display').textContent = uniqueUserId;
                    return;
                }
            }
            uniqueUserId = generateUniqueId();
            document.getElementById('user-id-display').textContent = uniqueUserId;
        }

        function selectAvatar(element, avatarId) {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedAvatar = avatarId;
        }

        // ── Save profile ──────────────────────────────────────────────
        async function saveProfile() {
            const displayName  = document.getElementById('display-name').value.trim();
            const gender       = document.querySelector('input[name="gender"]:checked')?.value || '';
            const bio          = document.getElementById('bio').value.trim();
            const twitterLink  = document.getElementById('twitter-link').value.trim();
            const linkedinLink = document.getElementById('linkedin-link').value.trim();
            const githubLink   = document.getElementById('github-link').value.trim();

            if (!displayName)   { toast('Please enter a display name', 'error'); return; }
            if (!selectedAvatar){ toast('Please select an avatar', 'error');     return; }

            const btn = document.querySelector('button[onclick="saveProfile()"]');
            btn.disabled = true;
            btn.innerHTML = '<span>Saving…</span>';

            try {
                // 1. Get current auth session
                const { data: { session }, error: sessionErr } = await db.auth.getSession();
                if (sessionErr || !session) throw new Error('Not authenticated. Please sign in first.');

                // 2. Build the profile row
                const profileRow = {
                    id:           session.user.id,
                    uid:          uniqueUserId,
                    display_name: displayName,
                    gender,
                    bio,
                    avatar:       selectedAvatar,
                    social_twitter:  twitterLink  || null,
                    social_linkedin: linkedinLink || null,
                    social_github:   githubLink   || null,
                    setup_at:     new Date().toISOString(),
                };

                // 3. Upsert into Supabase profiles table
                const { error: upsertErr } = await db
                    .from('profiles')
                    .upsert(profileRow, { onConflict: 'id' });

                if (upsertErr) throw upsertErr;

                // 4. Cache in localStorage for instant load (offline-friendly)
                const localProfile = {
                    displayName,
                    gender,
                    bio,
                    socialLinks: { twitter: twitterLink, linkedin: linkedinLink, github: githubLink },
                    avatar:       selectedAvatar,
                    avatarGradient: AVATAR_GRADIENTS[selectedAvatar],
                    uid:          uniqueUserId,
                    setupAt:      new Date().toISOString(),
                };
                localStorage.setItem('userProfile', JSON.stringify(localProfile));

                window.location.href = 'dashbord.html';
            } catch (err) {
                console.error(err);
                toast(err.message || 'Failed to save profile. Please try again.', 'error', 4000);
                btn.disabled = false;
                btn.innerHTML = '<span>Complete Setup</span><i data-lucide="arrow-up-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        }

        function showError(msg) {
            toast(msg, 'error');
        }

        // ── Auth guard ────────────────────────────────────────────────
        // Must be logged in to access this page.
        // If profile already exists → skip straight to dashboard (one profile per account).
        async function guardPage() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) {
                // Not logged in → back to login
                window.location.href = 'index.html';
                return;
            }
            const { data: existing } = await db
                .from('profiles')
                .select('uid')
                .eq('id', session.user.id)
                .single();
            if (existing?.uid) {
                // Profile already set up → go to dashboard, can't create another
                window.location.href = 'dashbord.html';
                return;
            }
            // No profile yet → allow setup, then init UID
            await initUserId();
        }

        guardPage();
    </script>
</body>
</html>
