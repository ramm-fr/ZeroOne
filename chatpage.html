<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroOne — Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="toast.js"></script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0c0c0c; overflow: hidden; }
        .heading-font { font-family: 'Syne', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
        .lucide { transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), color 0.25s ease; }
        .icon-hover:hover .lucide { transform: scale(1.1); color: #ffffff; }
        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg-bubble { animation: bubbleIn 0.18s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
        .typing-dot { animation: blink 1.4s infinite both; }
        .typing-dot:nth-child(2){animation-delay:.2s}
        .typing-dot:nth-child(3){animation-delay:.4s}
        #chat-input { resize: none; max-height: 120px; overflow-y: auto; }
        #info-panel { transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); }
        /* Picker panels */
        .picker-panel { transition: opacity 0.15s ease, transform 0.15s cubic-bezier(0.16,1,0.3,1); }
        .picker-panel.hidden { opacity:0; pointer-events:none; transform: translateY(6px); }
        .picker-panel.open   { opacity:1; pointer-events:auto; transform: translateY(0); }
        /* Call overlay */
        #call-overlay { transition: opacity 0.25s ease; }
        @keyframes callPulse { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.12);opacity:1} }
        .call-pulse { animation: callPulse 1.6s ease-in-out infinite; }
        /* emoji/sticker btn active */
        .picker-btn-active { background: rgba(255,255,255,0.08) !important; color: #fff !important; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col m-0 p-0 select-none bg-[#0c0c0c] text-zinc-100">

<!-- ═══ CALL OVERLAY ════════════════════════════════════════════════ -->
<div id="call-overlay" class="fixed inset-0 z-50 bg-[#0c0c0c] flex-col items-center justify-center gap-8 hidden">
    <div class="flex flex-col items-center gap-4">
        <div class="relative">
            <div class="call-pulse absolute inset-0 rounded-full border-2 border-zinc-700 scale-125"></div>
            <div id="call-contact-avatar" class="w-24 h-24 rounded-full border-2 border-zinc-600 bg-zinc-800 flex items-center justify-center text-2xl font-bold text-white"></div>
        </div>
        <div class="text-center">
            <p id="call-contact-name" class="heading-font text-xl font-extrabold text-white tracking-tight"></p>
            <p id="call-status" class="text-xs font-mono text-zinc-500 mt-1 tracking-widest uppercase">Calling…</p>
        </div>
    </div>
    <!-- Video preview area (video call only) -->
    <div id="video-area" class="hidden w-full max-w-2xl aspect-video bg-zinc-900 border border-zinc-800 relative overflow-hidden">
        <video id="local-video" class="absolute bottom-3 right-3 w-32 h-24 object-cover border border-zinc-700 z-10" autoplay muted playsinline></video>
        <div class="w-full h-full flex items-center justify-center">
            <div class="flex flex-col items-center gap-3 text-zinc-600">
                <i data-lucide="video-off" class="w-12 h-12"></i>
                <span class="text-xs font-mono tracking-widest uppercase">Waiting for connection…</span>
            </div>
        </div>
    </div>
    <!-- Call controls -->
    <div class="flex items-center gap-4">
        <button id="btn-mute" onclick="toggleMute()" title="Mute"
            class="w-14 h-14 rounded-full border border-zinc-700 bg-zinc-900 hover:bg-zinc-800 flex items-center justify-center transition-colors cursor-pointer">
            <i data-lucide="mic" class="w-5 h-5 text-zinc-300"></i>
        </button>
        <button onclick="endCall()" title="End Call"
            class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center transition-colors cursor-pointer shadow-lg">
            <i data-lucide="phone-off" class="w-6 h-6 text-white"></i>
        </button>
        <button id="btn-cam" onclick="toggleCamera()" title="Camera"
            class="w-14 h-14 rounded-full border border-zinc-700 bg-zinc-900 hover:bg-zinc-800 flex items-center justify-center transition-colors cursor-pointer">
            <i data-lucide="video" class="w-5 h-5 text-zinc-300"></i>
        </button>
    </div>
    <p class="text-[10px] font-mono text-zinc-700 tracking-widest uppercase">Encrypted call — ZeroOne</p>
</div>
<!-- ═══ END CALL OVERLAY ═════════════════════════════════════════════ -->

<!-- TOP NAV -->
<header class="w-full h-16 border-b border-zinc-800/80 bg-[#111111] px-4 sm:px-6 flex items-center justify-between z-30 flex-shrink-0">
    <div class="flex items-center gap-3">
        <button onclick="window.location.href='dashbord.html'"
            class="icon-hover p-2 border border-zinc-800 hover:border-zinc-400 bg-zinc-900/30 transition-all cursor-pointer flex items-center justify-center">
            <i data-lucide="arrow-left" class="w-4 h-4 text-zinc-400"></i>
        </button>
        <div id="contact-avatar" class="w-9 h-9 rounded-full border border-zinc-700 bg-zinc-800 flex items-center justify-center text-[10px] font-bold text-white flex-shrink-0"></div>
        <div class="min-w-0">
            <p id="contact-name" class="text-sm font-bold text-white truncate leading-tight">—</p>
            <div class="flex items-center gap-1.5">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                <p id="contact-role" class="text-[10px] font-mono text-zinc-500 truncate">Online</p>
            </div>
        </div>
    </div>
    <div class="flex items-center gap-1.5">
        <button onclick="startCall('audio')"
            class="icon-hover p-2 border border-zinc-800 hover:border-emerald-700 hover:bg-emerald-950/20 transition-all cursor-pointer flex items-center justify-center" title="Voice Call">
            <i data-lucide="phone" class="w-4 h-4 text-zinc-400"></i>
        </button>
        <button onclick="startCall('video')"
            class="icon-hover p-2 border border-zinc-800 hover:border-blue-700 hover:bg-blue-950/20 transition-all cursor-pointer flex items-center justify-center" title="Video Call">
            <i data-lucide="video" class="w-4 h-4 text-zinc-400"></i>
        </button>
        <button onclick="toggleInfoPanel()"
            class="icon-hover p-2 border border-zinc-800 hover:border-zinc-400 transition-all cursor-pointer flex items-center justify-center" title="Contact Info">
            <i data-lucide="info" class="w-4 h-4 text-zinc-400"></i>
        </button>
        <div class="relative w-9 h-9 rounded-full border border-zinc-700 p-[2px] bg-zinc-800 ml-1">
            <div id="nav-avatar" class="w-full h-full rounded-full flex items-center justify-center text-[10px] font-bold text-white bg-zinc-700"></div>
            <div class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-[#0c0c0c]"></div>
        </div>
    </div>
</header>

<!-- MAIN -->
<main class="flex-1 w-full flex overflow-hidden min-h-0 relative">
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1a1a1a_1px,transparent_1px),linear-gradient(to_bottom,#1a1a1a_1px,transparent_1px)] bg-[size:4rem_4rem] opacity-[0.4] pointer-events-none z-0"></div>

    <!-- CHAT COLUMN -->
    <section class="flex-1 flex flex-col min-w-0 z-10 relative">
        <!-- Messages -->
        <div id="messages-area" class="flex-1 overflow-y-auto custom-scroll px-4 sm:px-6 py-5 space-y-4">
            <div class="flex items-center gap-3 my-2">
                <div class="flex-1 h-px bg-zinc-800/60"></div>
                <span class="text-[9px] font-mono text-zinc-600 uppercase tracking-widest">Today</span>
                <div class="flex-1 h-px bg-zinc-800/60"></div>
            </div>
            <div class="flex justify-center">
                <div class="flex items-center gap-1.5 bg-zinc-900/30 border border-zinc-800 px-3 py-1.5">
                    <i data-lucide="lock" class="w-3 h-3 text-zinc-600"></i>
                    <span class="text-[10px] font-mono text-zinc-600">End-to-end encrypted channel</span>
                </div>
            </div>
        </div>

        <!-- Typing indicator -->
        <div id="typing-indicator" class="hidden px-4 sm:px-6 pb-2 items-center gap-2">
            <div id="typing-avatar" class="w-6 h-6 rounded-full border border-zinc-800 bg-zinc-900/60 flex items-center justify-center text-[8px] font-bold text-zinc-400 flex-shrink-0"></div>
            <div class="bg-zinc-900/60 border border-zinc-800 px-3 py-2 flex gap-1 items-center">
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-zinc-400 block"></span>
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-zinc-400 block"></span>
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-zinc-400 block"></span>
            </div>
        </div>

        <!-- ── EMOJI PICKER ── -->
        <div id="emoji-picker" class="picker-panel hidden absolute bottom-20 left-4 sm:left-6 bg-[#111111] border border-zinc-800/80 shadow-2xl z-40 w-72 p-3">
            <p class="text-[9px] uppercase tracking-widest text-zinc-600 mb-2 px-1">Emoji</p>
            <div id="emoji-grid" class="grid grid-cols-8 gap-1 max-h-48 overflow-y-auto custom-scroll"></div>
        </div>

        <!-- ── STICKER PICKER ── -->
        <div id="sticker-picker" class="picker-panel hidden absolute bottom-20 left-4 sm:left-6 bg-[#111111] border border-zinc-800/80 shadow-2xl z-40 w-80 flex flex-col" style="max-height:340px">
            <!-- Header + search -->
            <div class="flex items-center gap-2 px-3 pt-3 pb-2 border-b border-zinc-800/60 flex-shrink-0">
                <p class="text-[9px] uppercase tracking-widest text-zinc-600 flex-shrink-0">GIF / Sticker</p>
                <div class="flex-1 relative">
                    <input id="gif-search" type="text" placeholder="Search GIFs…"
                        oninput="onGifSearch(this.value)"
                        class="w-full bg-zinc-900/40 border border-zinc-800 focus:border-zinc-500 text-xs text-zinc-200 placeholder-zinc-700 px-2.5 py-1.5 focus:outline-none transition-colors" />
                </div>
                <span class="text-[8px] font-mono text-zinc-700 flex-shrink-0">via KLIPY</span>
            </div>
            <!-- Category tabs -->
            <div id="gif-categories" class="flex gap-1 px-3 py-2 overflow-x-auto flex-shrink-0 custom-scroll" style="scrollbar-width:none"></div>
            <!-- GIF grid -->
            <div id="sticker-grid" class="flex-1 overflow-y-auto custom-scroll px-3 pb-3">
                <div id="gif-loading" class="flex items-center justify-center py-6 text-zinc-600">
                    <span class="text-[10px] font-mono tracking-widest">Loading…</span>
                </div>
            </div>
        </div>

        <!-- INPUT BAR -->
        <div class="flex-shrink-0 border-t border-zinc-800/80 bg-[#111111] px-4 sm:px-6 py-3 relative">
            <div class="flex items-end gap-2">
                <!-- Sticker btn -->
                <button id="sticker-btn" onclick="togglePicker('sticker')"
                    class="icon-hover flex-shrink-0 p-2 text-zinc-500 hover:text-zinc-200 transition-colors cursor-pointer" title="Stickers">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                </button>
                <!-- Text input -->
                <div class="flex-1">
                    <textarea id="chat-input" rows="1"
                        placeholder="Send a message…"
                        onkeydown="handleInputKey(event)"
                        oninput="autoGrow(this)"
                        class="w-full bg-zinc-900/30 border border-zinc-800 px-4 py-2.5 text-sm text-zinc-200 placeholder-zinc-700 focus:outline-none focus:border-zinc-400 transition-all leading-relaxed custom-scroll"></textarea>
                </div>
                <!-- Emoji btn -->
                <button id="emoji-btn" onclick="togglePicker('emoji')"
                    class="icon-hover flex-shrink-0 p-2 text-zinc-500 hover:text-zinc-200 transition-colors cursor-pointer" title="Emoji">
                    <i data-lucide="smile" class="w-4 h-4"></i>
                </button>
                <!-- Send -->
                <button onclick="sendMessage()"
                    class="flex-shrink-0 w-9 h-9 bg-white hover:bg-zinc-200 text-black flex items-center justify-center transition-colors cursor-pointer">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
            <p class="text-[9px] font-mono text-zinc-700 mt-1.5 text-right">Enter to send · Shift+Enter for new line</p>
        </div>
    </section>

    <!-- CONTACT INFO PANEL -->
    <aside id="info-panel"
        class="w-72 flex-shrink-0 border-l border-zinc-800/80 bg-[#111111] flex flex-col overflow-hidden absolute right-0 top-0 bottom-0 translate-x-full z-20">
        <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-800/80 flex-shrink-0">
            <h3 class="heading-font text-[10px] font-bold uppercase tracking-widest text-white">Contact Info</h3>
            <button onclick="toggleInfoPanel()" class="p-1 text-zinc-500 hover:text-white transition-colors cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto custom-scroll px-5 py-5 space-y-5">
            <div class="flex flex-col items-center gap-3 pb-5 border-b border-zinc-800/60">
                <div id="panel-avatar" class="w-16 h-16 rounded-full border-2 border-zinc-700 bg-zinc-800 flex items-center justify-center text-xl font-bold text-white"></div>
                <div class="text-center">
                    <p id="panel-name" class="text-sm font-bold text-white">—</p>
                    <p id="panel-role" class="text-[10px] text-zinc-500 uppercase tracking-widest mt-0.5"></p>
                </div>
                <div class="flex items-center gap-1.5 bg-zinc-900/30 border border-zinc-800 px-3 py-1">
                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                    <span class="text-[10px] font-mono text-zinc-400">Online</span>
                </div>
            </div>
            <div class="space-y-2">
                <p class="text-[9px] uppercase tracking-widest text-zinc-600">Quick Actions</p>
                <button onclick="startCall('audio')" class="w-full flex items-center gap-2.5 p-2.5 bg-zinc-900/20 border border-zinc-800 hover:border-emerald-700 hover:bg-emerald-950/10 transition-colors cursor-pointer group">
                    <i data-lucide="phone" class="w-3.5 h-3.5 text-zinc-500 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white transition-colors">Voice Call</span>
                </button>
                <button onclick="startCall('video')" class="w-full flex items-center gap-2.5 p-2.5 bg-zinc-900/20 border border-zinc-800 hover:border-blue-700 hover:bg-blue-950/10 transition-colors cursor-pointer group">
                    <i data-lucide="video" class="w-3.5 h-3.5 text-zinc-500 group-hover:text-blue-400 transition-colors"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white transition-colors">Video Call</span>
                </button>
                <button class="w-full flex items-center gap-2.5 p-2.5 bg-zinc-900/20 border border-zinc-800 hover:border-red-900/50 hover:bg-red-950/10 transition-colors cursor-pointer group">
                    <i data-lucide="ban" class="w-3.5 h-3.5 text-zinc-500 group-hover:text-red-400 transition-colors"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-red-400 transition-colors">Block User</span>
                </button>
            </div>
            <div class="space-y-2 pt-2 border-t border-zinc-800/60">
                <p class="text-[9px] uppercase tracking-widest text-zinc-600">Security</p>
                <div class="p-3 bg-zinc-900/20 border border-zinc-800 flex items-center gap-2.5">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500 flex-shrink-0"></i>
                    <div>
                        <p class="text-[11px] font-bold text-zinc-300">E2E Encrypted</p>
                        <p class="text-[9px] font-mono text-zinc-600">AES-256 channel</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-5 py-4 border-t border-zinc-800/80 flex-shrink-0">
            <button onclick="window.location.href='dashbord.html'"
                class="w-full border border-zinc-800 text-zinc-500 hover:text-white hover:border-zinc-400 text-xs py-2.5 uppercase tracking-wider cursor-pointer transition-colors flex items-center justify-center gap-1.5">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Contacts
            </button>
        </div>
    </aside>
</main>

<script>
    // ── Supabase ──────────────────────────────────────────────────
    const SUPABASE_URL      = 'https://belblvybuefysawyoocv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlbGJsdnlidWVmeXNhd3lvb2N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTgyMDAsImV4cCI6MjA5NTkzNDIwMH0.F7udCTa8bbmSiNg0Qx_xMZX7mrl-JifU44SSKvRQSk4';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const AVATAR_GRADIENTS = {
        avatar1:{from:'#a855f7',to:'#ec4899'},
        avatar2:{from:'#3b82f6',to:'#06b6d4'},
        avatar3:{from:'#22c55e',to:'#10b981'},
        avatar4:{from:'#f97316',to:'#ef4444'},
    };

    // ── URL params ────────────────────────────────────────────────
    const params   = new URLSearchParams(window.location.search);
    const cName    = params.get('name')     || 'Unknown';
    const cRole    = params.get('role')     || '';
    const cInit    = params.get('initials') || cName.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    const cUid     = params.get('uid')      || '';   // contact's UID

    document.getElementById('contact-name').textContent     = cName;
    document.getElementById('contact-role').textContent     = cRole || 'Online';
    document.getElementById('panel-name').textContent       = cName;
    document.getElementById('panel-role').textContent       = cRole;
    document.getElementById('call-contact-name').textContent= cName;
    ['contact-avatar','panel-avatar','typing-avatar','call-contact-avatar'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = cInit;
    });

    // ── Session + own UID ─────────────────────────────────────────
    let myUid        = null;
    let myId         = null;   // auth user id
    let conversationId = null; // sorted "uid1_uid2"
    let realtimeSub  = null;

    // ── Auth guard + load profile + boot chat ─────────────────────
    async function init() {
        let session = null;
        try {
            const res = await db.auth.getSession();
            session = res.data.session;
        } catch(e) { console.error('getSession failed:', e); }

        if (!session) { window.location.href = 'index.html'; return; }
        myId = session.user.id;

        // ── Step 1: Get own UID — try every source ────────────────
        // Source A: Supabase profiles table
        try {
            const { data: p } = await db
                .from('profiles')
                .select('display_name, avatar, uid')
                .eq('id', myId)
                .single();
            if (p && p.uid) {
                myUid = p.uid;
                renderNavAvatar(p.display_name, p.avatar);
            }
        } catch(e) {}

        // Source B: localStorage (always try — even if Supabase worked, uid might be null)
        if (!myUid) {
            const raw = localStorage.getItem('userProfile');
            if (raw) {
                try {
                    const p = JSON.parse(raw);
                    if (p.uid) { myUid = p.uid; renderNavAvatar(p.displayName, p.avatar); }
                } catch(e) {}
            }
        }

        // Source C: Self-heal — generate + save a UID right now if still missing
        if (!myUid) {
            myUid = (Math.floor(Math.random() * 900000) + 100000).toString();
            // Save to profiles table so it persists
            try {
                await db.from('profiles').upsert({ id: myId, uid: myUid }, { onConflict: 'id' });
            } catch(e) {}
            // Save to localStorage too
            const raw = localStorage.getItem('userProfile');
            if (raw) {
                try {
                    const p = JSON.parse(raw);
                    p.uid = myUid;
                    localStorage.setItem('userProfile', JSON.stringify(p));
                } catch(e) {}
            }
            toast('UID assigned: #' + myUid, 'info', 3000);
        }

        // ── Step 2: Resolve contact UID ───────────────────────────
        let resolvedCUid = cUid;

        // If cUid missing from URL (old contact link) — look up by name
        if (!resolvedCUid && cName && cName !== 'Unknown') {
            try {
                const { data: cp } = await db
                    .from('profiles')
                    .select('uid')
                    .ilike('display_name', cName)
                    .limit(1);
                if (cp && cp.length > 0 && cp[0].uid) resolvedCUid = cp[0].uid;
            } catch(e) {}
        }

        // ── Step 3: Build conversation ID ─────────────────────────
        if (myUid && resolvedCUid) {
            const parts = [myUid, resolvedCUid].sort();
            conversationId = parts[0] + '_' + parts[1];
        } else {
            const missing = [];
            if (!resolvedCUid) missing.push('contact UID missing — delete and re-add this contact from dashboard');
            toast(missing.join('. '), 'error', 8000);
            console.error('conversationId failed — myUid:', myUid, 'resolvedCUid:', resolvedCUid);
        }

        await loadHistory();
        subscribeRealtime();
        buildEmojiGrid();
        lucide.createIcons();
    }

    function renderNavAvatar(name, avatar) {
        const grad = AVATAR_GRADIENTS[avatar] || {from:'#52525b',to:'#27272a'};
        const ini  = name ? name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2) : '??';
        const nav  = document.getElementById('nav-avatar');
        nav.style.background = `linear-gradient(135deg,${grad.from},${grad.to})`;
        nav.textContent = ini;
    }

    // ── Load message history ──────────────────────────────────────
    async function loadHistory() {
        if (!conversationId) return;
        const { data, error } = await db
            .from('messages')
            .select('*')
            .eq('conversation_id', conversationId)
            .order('created_at', { ascending: true })
            .limit(100);

        if (error) {
            console.error('loadHistory error:', error);
            if (error.code === '42P01') {
                // Table doesn't exist yet
                toast('messages table missing in Supabase — run the setup SQL.', 'error', 6000);
            }
            return;
        }
        (data || []).forEach(row => renderRow(row));
    }

    // ── Real-time subscription ────────────────────────────────────
    function subscribeRealtime() {
        if (!conversationId) return;
        realtimeSub = db
            .channel('chat:' + conversationId)
            .on('postgres_changes', {
                event:  'INSERT',
                schema: 'public',
                table:  'messages',
                filter: 'conversation_id=eq.' + conversationId,
            }, payload => {
                // Only render if it's NOT from me (I already rendered on send)
                if (payload.new.sender_uid !== myUid) {
                    renderRow(payload.new);
                }
            })
            .subscribe();
    }

    // ── Render one DB row ─────────────────────────────────────────
    function renderRow(row) {
        const isMe      = row.sender_uid === myUid;
        const isSticker = row.type === 'sticker';
        const isGif     = row.type === 'gif';
        const content   = (isSticker || isGif) ? JSON.parse(row.body) : row.body;
        const ts        = new Date(row.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
        appendMessage(content, isMe ? 'me' : 'other', isSticker, ts, isGif ? 'gif' : null);
    }

    // ── Insert message to Supabase ────────────────────────────────
    async function persistMessage(body, type) {
        if (!conversationId || !myUid) {
            console.error('Missing required data:', { conversationId, myUid, cUid });
            toast('Not connected — message not delivered. Make sure both users have UIDs.', 'error', 4000);
            return;
        }

        console.log('Attempting to save message:', { conversationId, sender_uid: myUid, receiver_uid: cUid, type });

        const { error, data } = await db.from('messages').insert({
            conversation_id: conversationId,
            sender_uid:      myUid,
            receiver_uid:    cUid,
            body:            typeof body === 'object' ? JSON.stringify(body) : body,
            type:            type || 'text',
        }).select();

        if (error) {
            console.error('Message save failed:', error);
            console.error('Error details:', { code: error.code, message: error.message, details: error.details, hint: error.hint });

            if (error.code === '401' || error.code === '42501') {
                toast('Permission denied. Check Supabase RLS policies for messages table.', 'error', 6000);
            } else {
                toast('Message not delivered: ' + (error.message || 'DB error'), 'error', 4000);
            }
            return;
        }

        console.log('Message saved successfully:', data);

        // Auto-add sender as contact on receiver's dashboard.
        // We upsert a contact row with owner_id = receiver's auth id.
        // We need the receiver's auth id — look it up by their UID.
        try {
            const { data: receiverProfile } = await db
                .from('profiles')
                .select('id, display_name, gender, avatar')
                .eq('uid', cUid)
                .single();

            if (receiverProfile) {
                // Upsert: receiver gets sender as contact
                await db.from('contacts').upsert({
                    owner_id:    receiverProfile.id,
                    contact_uid: myUid,
                    name:        cName,      // sender's name as seen by receiver
                    role:        '',
                    initials:    cInit,
                    added_at:    new Date().toISOString(),
                }, { onConflict: 'owner_id,contact_uid' });

                // Also upsert: sender keeps receiver as contact (in case they don't have them yet)
                await db.from('contacts').upsert({
                    owner_id:    myId,
                    contact_uid: cUid,
                    name:        cName,
                    role:        cRole || '',
                    initials:    cInit,
                    added_at:    new Date().toISOString(),
                }, { onConflict: 'owner_id,contact_uid' });
            }
        } catch(e) {
            // Non-fatal — message was sent, contact auto-add failed silently
            console.warn('Auto-contact upsert failed:', e);
        }
    }

    // ── Info panel ────────────────────────────────────────────────
    let infoPanelOpen = false;
    function toggleInfoPanel() {
        infoPanelOpen = !infoPanelOpen;
        document.getElementById('info-panel').classList.toggle('translate-x-full', !infoPanelOpen);
    }

    // ── EMOJI DATA ────────────────────────────────────────────────
    const EMOJIS = [
        '😀','😂','🤣','😊','😍','🥰','😎','🤩','😏','😢','😭','😤',
        '😡','🤔','🤯','😴','🥳','🤗','😬','🙄','🥺','😇','🤭','🫡',
        '👍','👎','👏','🙌','🤝','✌️','🤞','💪','👀','❤️','🔥','⚡',
        '✅','❌','🎉','🎊','💯','🚀','💀','👻','🤖','🎮','💻','🔐',
    ];

    function buildEmojiGrid() {
        const grid = document.getElementById('emoji-grid');
        grid.innerHTML = '';
        EMOJIS.forEach(em => {
            const btn = document.createElement('button');
            btn.className = 'text-xl hover:bg-zinc-800 p-1 transition-colors cursor-pointer leading-none';
            btn.textContent = em;
            btn.onclick = () => { insertText(em); closePickers(); };
            grid.appendChild(btn);
        });
    }

    // ── STICKER / GIF via KLIPY API ───────────────────────────────
    // Uses KLIPY API (free alternative to Tenor/GIPHY)
    const KLIPY_KEY  = 'RHBu53IXXv5HjTDyDznxBoR6w9isCSriVXHyPRMoZvvoVa32yBSRL3BEPwgWgkr9';
    const KLIPY_LIMIT = 20;
    let gifSearchTimer = null;

    const GIF_CATEGORIES = [
        { label: '� Trending',  q: '' },
        { label: '� Funny',     q: 'funny' },
        { label: '� Love',      q: 'love' },
        { label: '👊 Hype',      q: 'hype' },
        { label: '� Reaction',  q: 'reaction' },
        { label: '� Celebrate', q: 'celebrate' },
        { label: '� Sad',       q: 'sad' },
        { label: '� Cool',      q: 'cool' },
    ];
    let activeCategory = '';

    async function fetchGifs(query) {
        const grid    = document.getElementById('sticker-grid');
        const loading = document.getElementById('gif-loading');
        grid.innerHTML = '';
        if (loading) { loading.style.display = 'flex'; grid.appendChild(loading); }

        try {
            const endpoint = query
                ? `https://api.klipy.com/api/v1/${KLIPY_KEY}/gifs/search?q=${encodeURIComponent(query)}&per_page=${KLIPY_LIMIT}`
                : `https://api.klipy.com/api/v1/${KLIPY_KEY}/gifs/trending?per_page=${KLIPY_LIMIT}`;

            const res  = await fetch(endpoint);
            const json = await res.json();

            console.log('KLIPY API response:', json);

            grid.innerHTML = '';

            if (!res.ok) {
                grid.innerHTML = `<p class="text-[10px] text-red-500 text-center py-4">API Error: ${json.message || json.error || 'Unknown error'}</p>`;
                console.error('KLIPY API error:', json);
                return;
            }

            if (!json.data || !json.data.data || json.data.data.length === 0) {
                grid.innerHTML = '<p class="text-[10px] text-zinc-600 text-center py-4 col-span-3">No results found.</p>';
                return;
            }

            // Two-column masonry-style grid
            const cols = [document.createElement('div'), document.createElement('div')];
            cols.forEach(c => {
                c.className = 'flex flex-col gap-1.5';
                grid.appendChild(c);
            });
            grid.className = 'flex-1 overflow-y-auto custom-scroll px-3 pb-3 grid gap-1.5';
            grid.style.gridTemplateColumns = '1fr 1fr';

            json.data.data.forEach((item, i) => {
                const gif = item.files?.gif || item.files?.mediumgif || item.files?.tinygif;
                if (!gif) return;

                const btn = document.createElement('button');
                btn.className = 'w-full overflow-hidden border border-zinc-800 hover:border-zinc-500 transition-colors cursor-pointer bg-zinc-900/40';
                btn.title = item.title || 'GIF';

                const img = document.createElement('img');
                img.src          = gif.url;
                img.alt          = item.title || 'GIF';
                img.className    = 'w-full h-auto block';
                img.loading      = 'lazy';
                img.style.aspectRatio = '1';
                img.style.objectFit   = 'cover';

                btn.appendChild(img);
                btn.onclick = () => {
                    sendGif({ url: gif.url, alt: item.title || 'GIF' });
                    closePickers();
                };

                cols[i % 2].appendChild(btn);
            });

        } catch(err) {
            grid.innerHTML = '<p class="text-[10px] text-red-500 text-center py-4">Failed to load GIFs.</p>';
            console.error('KLIPY fetch error:', err);
        }
    }

    function buildCategoryTabs() {
        const bar = document.getElementById('gif-categories');
        bar.innerHTML = '';
        GIF_CATEGORIES.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'flex-shrink-0 text-[10px] font-mono px-2.5 py-1 border transition-colors cursor-pointer whitespace-nowrap ' +
                (cat.q === activeCategory
                    ? 'border-zinc-400 text-white bg-zinc-800'
                    : 'border-zinc-800 text-zinc-500 hover:border-zinc-600 hover:text-zinc-300');
            btn.textContent = cat.label;
            btn.onclick = () => {
                activeCategory = cat.q;
                document.getElementById('gif-search').value = '';
                buildCategoryTabs(); // re-render to update active state
                fetchGifs(cat.q);
            };
            bar.appendChild(btn);
        });
    }

    function onGifSearch(val) {
        clearTimeout(gifSearchTimer);
        gifSearchTimer = setTimeout(() => {
            activeCategory = '';
            buildCategoryTabs();
            fetchGifs(val.trim());
        }, 400);
    }

    // Called when user picks a GIF — sends it as a message
    function sendGif(gif) {
        appendMessage(gif, 'me', false, null, 'gif');
        persistMessage(JSON.stringify(gif), 'gif');
    }

    function buildStickerGrid() {
        // Populated dynamically via Tenor API when picker opens
        buildCategoryTabs();
        fetchGifs('');
    }

    // ── Picker toggle ─────────────────────────────────────────────
    let activePicker   = null;
    let gifLoaded      = false;   // only fetch trending once per session

    function togglePicker(type) {
        if (activePicker === type) { closePickers(); return; }
        closePickers();
        activePicker = type;
        const el  = document.getElementById(type + '-picker');
        const btn = document.getElementById(type + '-btn');
        el.classList.remove('hidden');
        el.classList.add('open');
        btn.classList.add('picker-btn-active');

        // Load GIFs the first time the sticker picker opens
        if (type === 'sticker' && !gifLoaded) {
            gifLoaded = true;
            buildCategoryTabs();
            fetchGifs('');
        }
    }
    function closePickers() {
        activePicker = null;
        ['emoji','sticker'].forEach(t => {
            document.getElementById(t+'-picker').classList.remove('open');
            document.getElementById(t+'-picker').classList.add('hidden');
            document.getElementById(t+'-btn').classList.remove('picker-btn-active');
        });
    }
    document.addEventListener('click', e => {
        if (!e.target.closest('#emoji-picker,#sticker-picker,#emoji-btn,#sticker-btn')) closePickers();
    });

    function insertText(str) {
        const inp = document.getElementById('chat-input');
        const s = inp.selectionStart, e2 = inp.selectionEnd;
        inp.value = inp.value.slice(0,s) + str + inp.value.slice(e2);
        inp.selectionStart = inp.selectionEnd = s + str.length;
        inp.focus(); autoGrow(inp);
    }

    // ── CALL SYSTEM ───────────────────────────────────────────────
    let currentStream = null, callType = null, isMuted = false, isCamOff = false;

    async function startCall(type) {
        callType = type;
        const overlay   = document.getElementById('call-overlay');
        const videoArea = document.getElementById('video-area');
        const camBtn    = document.getElementById('btn-cam');
        overlay.classList.remove('hidden'); overlay.classList.add('flex');
        document.getElementById('call-status').textContent = type === 'video' ? 'Connecting video…' : 'Calling…';
        type === 'video'
            ? (videoArea.classList.remove('hidden'), camBtn.classList.remove('hidden'))
            : (videoArea.classList.add('hidden'),    camBtn.classList.add('hidden'));
        lucide.createIcons();
        try {
            currentStream = await navigator.mediaDevices.getUserMedia(
                type === 'video' ? {audio:true,video:true} : {audio:true,video:false}
            );
            if (type === 'video') document.getElementById('local-video').srcObject = currentStream;
            setTimeout(() => {
                document.getElementById('call-status').textContent =
                    type === 'video' ? 'Video call connected' : 'Call connected';
            }, 1500);
        } catch(err) {
            toast('Cannot access mic/camera: ' + err.message, 'error', 4000);
            endCall();
        }
    }

    function endCall() {
        if (currentStream) { currentStream.getTracks().forEach(t=>t.stop()); currentStream=null; }
        document.getElementById('call-overlay').classList.add('hidden');
        document.getElementById('call-overlay').classList.remove('flex');
        document.getElementById('local-video').srcObject = null;
        isMuted=false; isCamOff=false;
        toast('Call ended.','info',2000); lucide.createIcons();
    }

    function toggleMute() {
        if (!currentStream) return;
        isMuted = !isMuted;
        currentStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        const btn = document.getElementById('btn-mute');
        btn.querySelector('i').setAttribute('data-lucide', isMuted ? 'mic-off' : 'mic');
        btn.style.background   = isMuted ? 'rgba(239,68,68,0.2)' : '';
        btn.style.borderColor  = isMuted ? 'rgba(239,68,68,0.5)' : '';
        lucide.createIcons();
        toast(isMuted ? 'Muted.' : 'Unmuted.', 'info', 1500);
    }

    function toggleCamera() {
        if (!currentStream) return;
        isCamOff = !isCamOff;
        currentStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
        const btn = document.getElementById('btn-cam');
        btn.querySelector('i').setAttribute('data-lucide', isCamOff ? 'video-off' : 'video');
        btn.style.background  = isCamOff ? 'rgba(239,68,68,0.2)' : '';
        btn.style.borderColor = isCamOff ? 'rgba(239,68,68,0.5)' : '';
        lucide.createIcons();
        toast(isCamOff ? 'Camera off.' : 'Camera on.', 'info', 1500);
    }

    // ── MESSAGE RENDERING ─────────────────────────────────────────
    function nowTime() {
        return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    }

    function appendMessage(content, side, isSticker, tsOverride, msgType) {
        const area = document.getElementById('messages-area');
        const isMe = side === 'me';
        const wrapper = document.createElement('div');
        wrapper.className = 'flex items-end gap-2 msg-bubble ' + (isMe ? 'justify-end' : 'justify-start');

        if (!isMe) {
            const av = document.createElement('div');
            av.className = 'w-7 h-7 rounded-full border border-zinc-800 bg-zinc-900/60 flex items-center justify-center text-[9px] font-bold text-zinc-400 flex-shrink-0 mb-0.5';
            av.textContent = cInit;
            wrapper.appendChild(av);
        }

        const bubble = document.createElement('div');

        if (msgType === 'gif') {
            // Real GIF from Tenor
            bubble.className = 'flex flex-col items-' + (isMe ? 'end' : 'start') + ' gap-1';
            const gifData = typeof content === 'string' ? JSON.parse(content) : content;
            const img = document.createElement('img');
            img.src       = gifData.url;
            img.alt       = gifData.alt || 'GIF';
            img.className = 'max-w-[200px] border border-zinc-700';
            img.style.borderRadius = '2px';
            bubble.appendChild(img);
        } else if (isSticker) {
            bubble.className = 'flex flex-col items-' + (isMe ? 'end' : 'start') + ' gap-1';
            const box = document.createElement('div');
            box.className = 'w-24 h-24 border border-zinc-700 flex items-center justify-center text-2xl font-bold font-mono tracking-widest';
            box.style.background = content.bg; box.style.color = '#e4e4e7';
            box.textContent = content.text;
            bubble.appendChild(box);
        } else {
            bubble.className = isMe
                ? 'max-w-[70%] bg-white text-zinc-900 px-4 py-2.5 text-sm leading-relaxed'
                : 'max-w-[70%] bg-zinc-900/60 border border-zinc-800 text-zinc-100 px-4 py-2.5 text-sm leading-relaxed';
            const p = document.createElement('p');
            p.textContent = content;
            bubble.appendChild(p);
        }

        const ts = document.createElement('span');
        ts.className = 'block text-[9px] mt-1 font-mono ' + (isMe ? 'text-zinc-500 text-right' : 'text-zinc-600');
        ts.textContent = tsOverride || nowTime();
        bubble.appendChild(ts);
        wrapper.appendChild(bubble);
        area.appendChild(wrapper);
        area.scrollTop = area.scrollHeight;
    }

    // ── SEND ──────────────────────────────────────────────────────
    function sendMessage() {
        const input = document.getElementById('chat-input');
        const text  = input.value.trim();
        if (!text) return;
        appendMessage(text, 'me', false);       // render immediately
        persistMessage(text, 'text');            // save to Supabase
        input.value = ''; autoGrow(input);
    }

    function sendSticker(s) {
        appendMessage(s, 'me', true);
        persistMessage(s, 'sticker');
    }

    function handleInputKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // Typing indicator (local UI only)
    let typingTimer = null;
    function showTyping() {
        const ti = document.getElementById('typing-indicator');
        ti.classList.remove('hidden'); ti.classList.add('flex');
        document.getElementById('messages-area').scrollTop = 999999;
    }
    function hideTyping() {
        const ti = document.getElementById('typing-indicator');
        ti.classList.add('hidden'); ti.classList.remove('flex');
    }

    // ── BOOT ──────────────────────────────────────────────────────
    init();
</script>
