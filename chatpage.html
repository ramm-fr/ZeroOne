<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroOne — Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="toast.js"></script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0c0c0c; overflow: hidden; }
        .heading-font { font-family: 'Syne', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
        .lucide { transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), color 0.25s ease; }
        .icon-hover:hover .lucide { transform: scale(1.1); color: #ffffff; }
        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg-bubble { animation: bubbleIn 0.18s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
        .typing-dot { animation: blink 1.4s infinite both; }
        .typing-dot:nth-child(2){animation-delay:.2s}
        .typing-dot:nth-child(3){animation-delay:.4s}
        #chat-input { resize: none; max-height: 120px; overflow-y: auto; }
        #info-panel { transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); }
        /* Picker panels */
        .picker-panel { transition: opacity 0.15s ease, transform 0.15s cubic-bezier(0.16,1,0.3,1); }
        .picker-panel.hidden { opacity:0; pointer-events:none; transform: translateY(6px); }
        .picker-panel.open   { opacity:1; pointer-events:auto; transform: translateY(0); }
        /* Call overlay */
        #call-overlay { transition: opacity 0.25s ease; }
        @keyframes callPulse { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.12);opacity:1} }
        .call-pulse { animation: callPulse 1.6s ease-in-out infinite; }
        /* emoji/sticker btn active */
        .picker-btn-active { background: rgba(255,255,255,0.08) !important; color: #fff !important; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col m-0 p-0 select-none bg-[#0c0c0c] text-zinc-100">

<!-- ═══ CALL OVERLAY ════════════════════════════════════════════════ -->
<div id="call-overlay" class="fixed inset-0 z-50 bg-[#0c0c0c] flex-col items-center justify-center gap-8 hidden">
    <div class="flex flex-col items-center gap-4">
        <div class="relative">
            <div class="call-pulse absolute inset-0 rounded-full border-2 border-zinc-700 scale-125"></div>
            <div id="call-contact-avatar" class="w-24 h-24 rounded-full border-2 border-zinc-600 bg-zinc-800 flex items-center justify-center text-2xl font-bold text-white"></div>
        </div>
        <div class="text-center">
            <p id="call-contact-name" class="heading-font text-xl font-extrabold text-white tracking-tight"></p>
            <p id="call-status" class="text-xs font-mono text-zinc-500 mt-1 tracking-widest uppercase">Calling…</p>
        </div>
    </div>
    <!-- Video preview area (video call only) -->
    <div id="video-area" class="hidden w-full max-w-2xl aspect-video bg-zinc-900 border border-zinc-800 relative overflow-hidden">
        <video id="local-video" class="absolute bottom-3 right-3 w-32 h-24 object-cover border border-zinc-700 z-10" autoplay muted playsinline></video>
        <div class="w-full h-full flex items-center justify-center">
            <div class="flex flex-col items-center gap-3 text-zinc-600">
                <i data-lucide="video-off" class="w-12 h-12"></i>
                <span class="text-xs font-mono tracking-widest uppercase">Waiting for connection…</span>
            </div>
        </div>
    </div>
    <!-- Call controls -->
    <div class="flex items-center gap-4">
        <button id="btn-mute" onclick="toggleMute()" title="Mute"
            class="w-14 h-14 rounded-full border border-zinc-700 bg-zinc-900 hover:bg-zinc-800 flex items-center justify-center transition-colors cursor-pointer">
            <i data-lucide="mic" class="w-5 h-5 text-zinc-300"></i>
        </button>
        <button onclick="endCall()" title="End Call"
            class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center transition-colors cursor-pointer shadow-lg">
            <i data-lucide="phone-off" class="w-6 h-6 text-white"></i>
        </button>
        <button id="btn-cam" onclick="toggleCamera()" title="Camera"
            class="w-14 h-14 rounded-full border border-zinc-700 bg-zinc-900 hover:bg-zinc-800 flex items-center justify-center transition-colors cursor-pointer">
            <i data-lucide="video" class="w-5 h-5 text-zinc-300"></i>
        </button>
    </div>
    <p class="text-[10px] font-mono text-zinc-700 tracking-widest uppercase">Encrypted call — ZeroOne</p>
</div>
<!-- ═══ END CALL OVERLAY ═════════════════════════════════════════════ -->

<!-- TOP NAV -->
<header class="w-full h-16 border-b border-zinc-800/80 bg-[#111111] px-4 sm:px-6 flex items-center justify-between z-30 flex-shrink-0">
    <div class="flex items-center gap-3">
        <button onclick="window.location.href='dashbord.html'"
            class="icon-hover p-2 border border-zinc-800 hover:border-zinc-400 bg-zinc-900/30 transition-all cursor-pointer flex items-center justify-center">
            <i data-lucide="arrow-left" class="w-4 h-4 text-zinc-400"></i>
        </button>
        <div id="contact-avatar" class="w-9 h-9 rounded-full border border-zinc-700 bg-zinc-800 flex items-center justify-center text-[10px] font-bold text-white flex-shrink-0"></div>
        <div class="min-w-0">
            <p id="contact-name" class="text-sm font-bold text-white truncate leading-tight">—</p>
            <div class="flex items-center gap-1.5">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                <p id="contact-role" class="text-[10px] font-mono text-zinc-500 truncate">Online</p>
            </div>
        </div>
    </div>
    <div class="flex items-center gap-1.5">
        <button onclick="startCall('audio')"
            class="icon-hover p-2 border border-zinc-800 hover:border-emerald-700 hover:bg-emerald-950/20 transition-all cursor-pointer flex items-center justify-center" title="Voice Call">
            <i data-lucide="phone" class="w-4 h-4 text-zinc-400"></i>
        </button>
        <button onclick="startCall('video')"
            class="icon-hover p-2 border border-zinc-800 hover:border-blue-700 hover:bg-blue-950/20 transition-all cursor-pointer flex items-center justify-center" title="Video Call">
            <i data-lucide="video" class="w-4 h-4 text-zinc-400"></i>
        </button>
        <button onclick="toggleInfoPanel()"
            class="icon-hover p-2 border border-zinc-800 hover:border-zinc-400 transition-all cursor-pointer flex items-center justify-center" title="Contact Info">
            <i data-lucide="info" class="w-4 h-4 text-zinc-400"></i>
        </button>
        <div class="relative w-9 h-9 rounded-full border border-zinc-700 p-[2px] bg-zinc-800 ml-1">
            <div id="nav-avatar" class="w-full h-full rounded-full flex items-center justify-center text-[10px] font-bold text-white bg-zinc-700"></div>
            <div class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-[#0c0c0c]"></div>
        </div>
    </div>
</header>

<!-- MAIN -->
<main class="flex-1 w-full flex overflow-hidden min-h-0 relative">
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1a1a1a_1px,transparent_1px),linear-gradient(to_bottom,#1a1a1a_1px,transparent_1px)] bg-[size:4rem_4rem] opacity-[0.4] pointer-events-none z-0"></div>

    <!-- CHAT COLUMN -->
    <section class="flex-1 flex flex-col min-w-0 z-10 relative">
        <!-- Messages -->
        <div id="messages-area" class="flex-1 overflow-y-auto custom-scroll px-4 sm:px-6 py-5 space-y-4">
            <div class="flex items-center gap-3 my-2">
                <div class="flex-1 h-px bg-zinc-800/60"></div>
                <span class="text-[9px] font-mono text-zinc-600 uppercase tracking-widest">Today</span>
                <div class="flex-1 h-px bg-zinc-800/60"></div>
            </div>
            <div class="flex justify-center">
                <div class="flex items-center gap-1.5 bg-zinc-900/30 border border-zinc-800 px-3 py-1.5">
                    <i data-lucide="lock" class="w-3 h-3 text-zinc-600"></i>
                    <span class="text-[10px] font-mono text-zinc-600">End-to-end encrypted channel</span>
                </div>
            </div>
        </div>

        <!-- Typing indicator -->
        <div id="typing-indicator" class="hidden px-4 sm:px-6 pb-2 items-center gap-2">
            <div id="typing-avatar" class="w-6 h-6 rounded-full border border-zinc-800 bg-zinc-900/60 flex items-center justify-center text-[8px] font-bold text-zinc-400 flex-shrink-0"></div>
            <div class="bg-zinc-900/60 border border-zinc-800 px-3 py-2 flex gap-1 items-center">
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-zinc-400 block"></span>
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-zinc-400 block"></span>
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-zinc-400 block"></span>
            </div>
        </div>

        <!-- ── EMOJI PICKER ── -->
        <div id="emoji-picker" class="picker-panel hidden absolute bottom-20 left-4 sm:left-6 bg-[#111111] border border-zinc-800/80 shadow-2xl z-40 w-72 p-3">
            <p class="text-[9px] uppercase tracking-widest text-zinc-600 mb-2 px-1">Emoji</p>
            <div id="emoji-grid" class="grid grid-cols-8 gap-1 max-h-48 overflow-y-auto custom-scroll"></div>
        </div>

        <!-- ── STICKER PICKER ── -->
        <div id="sticker-picker" class="picker-panel hidden absolute bottom-20 left-4 sm:left-6 bg-[#111111] border border-zinc-800/80 shadow-2xl z-40 w-80 p-3">
            <p class="text-[9px] uppercase tracking-widest text-zinc-600 mb-2 px-1">Stickers</p>
            <div id="sticker-grid" class="grid grid-cols-4 gap-2 max-h-52 overflow-y-auto custom-scroll"></div>
        </div>

        <!-- INPUT BAR -->
        <div class="flex-shrink-0 border-t border-zinc-800/80 bg-[#111111] px-4 sm:px-6 py-3 relative">
            <div class="flex items-end gap-2">
                <!-- Sticker btn -->
                <button id="sticker-btn" onclick="togglePicker('sticker')"
                    class="icon-hover flex-shrink-0 p-2 text-zinc-500 hover:text-zinc-200 transition-colors cursor-pointer" title="Stickers">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                </button>
                <!-- Text input -->
                <div class="flex-1">
                    <textarea id="chat-input" rows="1"
                        placeholder="Send a message…"
                        onkeydown="handleInputKey(event)"
                        oninput="autoGrow(this)"
                        class="w-full bg-zinc-900/30 border border-zinc-800 px-4 py-2.5 text-sm text-zinc-200 placeholder-zinc-700 focus:outline-none focus:border-zinc-400 transition-all leading-relaxed custom-scroll"></textarea>
                </div>
                <!-- Emoji btn -->
                <button id="emoji-btn" onclick="togglePicker('emoji')"
                    class="icon-hover flex-shrink-0 p-2 text-zinc-500 hover:text-zinc-200 transition-colors cursor-pointer" title="Emoji">
                    <i data-lucide="smile" class="w-4 h-4"></i>
                </button>
                <!-- Send -->
                <button onclick="sendMessage()"
                    class="flex-shrink-0 w-9 h-9 bg-white hover:bg-zinc-200 text-black flex items-center justify-center transition-colors cursor-pointer">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
            <p class="text-[9px] font-mono text-zinc-700 mt-1.5 text-right">Enter to send · Shift+Enter for new line</p>
        </div>
    </section>

    <!-- CONTACT INFO PANEL -->
    <aside id="info-panel"
        class="w-72 flex-shrink-0 border-l border-zinc-800/80 bg-[#111111] flex flex-col overflow-hidden absolute right-0 top-0 bottom-0 translate-x-full z-20">
        <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-800/80 flex-shrink-0">
            <h3 class="heading-font text-[10px] font-bold uppercase tracking-widest text-white">Contact Info</h3>
            <button onclick="toggleInfoPanel()" class="p-1 text-zinc-500 hover:text-white transition-colors cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto custom-scroll px-5 py-5 space-y-5">
            <div class="flex flex-col items-center gap-3 pb-5 border-b border-zinc-800/60">
                <div id="panel-avatar" class="w-16 h-16 rounded-full border-2 border-zinc-700 bg-zinc-800 flex items-center justify-center text-xl font-bold text-white"></div>
                <div class="text-center">
                    <p id="panel-name" class="text-sm font-bold text-white">—</p>
                    <p id="panel-role" class="text-[10px] text-zinc-500 uppercase tracking-widest mt-0.5"></p>
                </div>
                <div class="flex items-center gap-1.5 bg-zinc-900/30 border border-zinc-800 px-3 py-1">
                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                    <span class="text-[10px] font-mono text-zinc-400">Online</span>
                </div>
            </div>
            <div class="space-y-2">
                <p class="text-[9px] uppercase tracking-widest text-zinc-600">Quick Actions</p>
                <button onclick="startCall('audio')" class="w-full flex items-center gap-2.5 p-2.5 bg-zinc-900/20 border border-zinc-800 hover:border-emerald-700 hover:bg-emerald-950/10 transition-colors cursor-pointer group">
                    <i data-lucide="phone" class="w-3.5 h-3.5 text-zinc-500 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white transition-colors">Voice Call</span>
                </button>
                <button onclick="startCall('video')" class="w-full flex items-center gap-2.5 p-2.5 bg-zinc-900/20 border border-zinc-800 hover:border-blue-700 hover:bg-blue-950/10 transition-colors cursor-pointer group">
                    <i data-lucide="video" class="w-3.5 h-3.5 text-zinc-500 group-hover:text-blue-400 transition-colors"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white transition-colors">Video Call</span>
                </button>
                <button class="w-full flex items-center gap-2.5 p-2.5 bg-zinc-900/20 border border-zinc-800 hover:border-red-900/50 hover:bg-red-950/10 transition-colors cursor-pointer group">
                    <i data-lucide="ban" class="w-3.5 h-3.5 text-zinc-500 group-hover:text-red-400 transition-colors"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-red-400 transition-colors">Block User</span>
                </button>
            </div>
            <div class="space-y-2 pt-2 border-t border-zinc-800/60">
                <p class="text-[9px] uppercase tracking-widest text-zinc-600">Security</p>
                <div class="p-3 bg-zinc-900/20 border border-zinc-800 flex items-center gap-2.5">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500 flex-shrink-0"></i>
                    <div>
                        <p class="text-[11px] font-bold text-zinc-300">E2E Encrypted</p>
                        <p class="text-[9px] font-mono text-zinc-600">AES-256 channel</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-5 py-4 border-t border-zinc-800/80 flex-shrink-0">
            <button onclick="window.location.href='dashbord.html'"
                class="w-full border border-zinc-800 text-zinc-500 hover:text-white hover:border-zinc-400 text-xs py-2.5 uppercase tracking-wider cursor-pointer transition-colors flex items-center justify-center gap-1.5">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Contacts
            </button>
        </div>
    </aside>
</main>

<script>
    // ── Supabase ──────────────────────────────────────────────────
    const SUPABASE_URL      = 'https://belblvybuefysawyoocv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlbGJsdnlidWVmeXNhd3lvb2N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTgyMDAsImV4cCI6MjA5NTkzNDIwMH0.F7udCTa8bbmSiNg0Qx_xMZX7mrl-JifV44SSKvRQSk4';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const AVATAR_GRADIENTS = {
        avatar1:{from:'#a855f7',to:'#ec4899'},
        avatar2:{from:'#3b82f6',to:'#06b6d4'},
        avatar3:{from:'#22c55e',to:'#10b981'},
        avatar4:{from:'#f97316',to:'#ef4444'},
    };

    // ── URL params ────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const cName  = params.get('name')     || 'Unknown';
    const cRole  = params.get('role')     || '';
    const cInit  = params.get('initials') || cName.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);

    document.getElementById('contact-name').textContent = cName;
    document.getElementById('contact-role').textContent = cRole || 'Online';
    document.getElementById('panel-name').textContent   = cName;
    document.getElementById('panel-role').textContent   = cRole;
    document.getElementById('call-contact-name').textContent = cName;
    ['contact-avatar','panel-avatar','typing-avatar','call-contact-avatar'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = cInit;
    });

    // ── Auth guard + profile ──────────────────────────────────────
    async function init() {
        try {
            const { data:{ session } } = await db.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            const { data:p } = await db.from('profiles').select('display_name,avatar').eq('id',session.user.id).single();
            if (p) {
                const grad = AVATAR_GRADIENTS[p.avatar]||{from:'#52525b',to:'#27272a'};
                const ini  = p.display_name ? p.display_name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2) : '??';
                const nav  = document.getElementById('nav-avatar');
                nav.style.background = `linear-gradient(135deg,${grad.from},${grad.to})`;
                nav.textContent = ini;
                return;
            }
        } catch(e) {}
        const raw = localStorage.getItem('userProfile');
        if (raw) {
            const p = JSON.parse(raw);
            const grad = AVATAR_GRADIENTS[p.avatar]||{from:'#52525b',to:'#27272a'};
            const ini  = p.displayName ? p.displayName.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2) : '??';
            const nav  = document.getElementById('nav-avatar');
            nav.style.background = `linear-gradient(135deg,${grad.from},${grad.to})`;
            nav.textContent = ini;
        }
    }
    init();

    // ── Info panel ────────────────────────────────────────────────
    let infoPanelOpen = false;
    function toggleInfoPanel() {
        infoPanelOpen = !infoPanelOpen;
        document.getElementById('info-panel').classList.toggle('translate-x-full', !infoPanelOpen);
    }

    // ── EMOJI DATA ────────────────────────────────────────────────
    const EMOJIS = [
        '😀','😂','🤣','😊','😍','🥰','😎','🤩','😏','😢','😭','😤',
        '😡','🤔','🤯','😴','🥳','🤗','😬','🙄','🥺','😇','🤭','🫡',
        '👍','👎','👏','🙌','🤝','✌️','🤞','💪','👀','❤️','🔥','⚡',
        '✅','❌','🎉','🎊','💯','🚀','💀','👻','🤖','🎮','💻','🔐',
    ];

    function buildEmojiGrid() {
        const grid = document.getElementById('emoji-grid');
        grid.innerHTML = '';
        EMOJIS.forEach(em => {
            const btn = document.createElement('button');
            btn.className = 'text-xl hover:bg-zinc-800 p-1 transition-colors cursor-pointer leading-none';
            btn.textContent = em;
            btn.onclick = () => { insertText(em); closePickers(); };
            grid.appendChild(btn);
        });
    }

    // ── STICKER DATA ──────────────────────────────────────────────
    const STICKERS = [
        {label:'👾 Glitch',  bg:'#1a1a2e', text:'GLITCH'},
        {label:'💀 Skull',   bg:'#1c1c1c', text:'☠️'},
        {label:'🔥 Fire',    bg:'#1a0a00', text:'🔥🔥🔥'},
        {label:'⚡ Zap',     bg:'#0d1117', text:'⚡ ZAP'},
        {label:'🤖 Bot',     bg:'#001122', text:'🤖 BOT'},
        {label:'🎮 GG',      bg:'#0a0014', text:'GG EZ'},
        {label:'💯 Facts',   bg:'#001a00', text:'💯'},
        {label:'🚀 Launch',  bg:'#000d1a', text:'🚀 LFG'},
        {label:'🔐 Secure',  bg:'#001a0d', text:'🔐 SAFE'},
        {label:'👻 Ghost',   bg:'#111111', text:'👻 BOO'},
        {label:'✅ Done',    bg:'#001a07', text:'✅ DONE'},
        {label:'❌ Denied',  bg:'#1a0000', text:'❌ NOPE'},
    ];

    function buildStickerGrid() {
        const grid = document.getElementById('sticker-grid');
        grid.innerHTML = '';
        STICKERS.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'aspect-square border border-zinc-800 hover:border-zinc-500 transition-colors cursor-pointer flex items-center justify-center text-sm font-bold tracking-widest font-mono';
            btn.style.background = s.bg;
            btn.style.color = '#e4e4e7';
            btn.textContent = s.text;
            btn.title = s.label;
            btn.onclick = () => { sendSticker(s); closePickers(); };
            grid.appendChild(btn);
        });
    }

    // ── Picker toggle ─────────────────────────────────────────────
    let activePicker = null;
    function togglePicker(type) {
        const emojiEl   = document.getElementById('emoji-picker');
        const stickerEl = document.getElementById('sticker-picker');
        const emojiBtn  = document.getElementById('emoji-btn');
        const stickerBtn= document.getElementById('sticker-btn');

        if (activePicker === type) {
            closePickers();
            return;
        }
        closePickers();
        activePicker = type;
        if (type === 'emoji') {
            emojiEl.classList.remove('hidden');
            emojiEl.classList.add('open');
            emojiBtn.classList.add('picker-btn-active');
        } else {
            stickerEl.classList.remove('hidden');
            stickerEl.classList.add('open');
            stickerBtn.classList.add('picker-btn-active');
        }
    }

    function closePickers() {
        activePicker = null;
        ['emoji-picker','sticker-picker'].forEach(id => {
            const el = document.getElementById(id);
            el.classList.remove('open');
            el.classList.add('hidden');
        });
        document.getElementById('emoji-btn').classList.remove('picker-btn-active');
        document.getElementById('sticker-btn').classList.remove('picker-btn-active');
    }

    // Close pickers on outside click
    document.addEventListener('click', e => {
        if (!e.target.closest('#emoji-picker, #sticker-picker, #emoji-btn, #sticker-btn')) {
            closePickers();
        }
    });

    function insertText(str) {
        const inp = document.getElementById('chat-input');
        const start = inp.selectionStart, end = inp.selectionEnd;
        inp.value = inp.value.slice(0,start) + str + inp.value.slice(end);
        inp.selectionStart = inp.selectionEnd = start + str.length;
        inp.focus();
        autoGrow(inp);
    }

    // ── CALL SYSTEM ───────────────────────────────────────────────
    let currentStream = null;
    let callType = null;
    let isMuted = false, isCamOff = false;

    async function startCall(type) {
        callType = type;
        const overlay = document.getElementById('call-overlay');
        const videoArea = document.getElementById('video-area');
        const camBtn = document.getElementById('btn-cam');

        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        document.getElementById('call-status').textContent = type === 'video' ? 'Connecting video…' : 'Calling…';
        lucide.createIcons();

        if (type === 'video') {
            videoArea.classList.remove('hidden');
            camBtn.classList.remove('hidden');
        } else {
            videoArea.classList.add('hidden');
            camBtn.classList.add('hidden');
        }

        try {
            const constraints = type === 'video'
                ? { audio: true, video: true }
                : { audio: true, video: false };

            currentStream = await navigator.mediaDevices.getUserMedia(constraints);

            if (type === 'video') {
                document.getElementById('local-video').srcObject = currentStream;
            }

            // Simulate connection after 1.5s
            setTimeout(() => {
                document.getElementById('call-status').textContent =
                    type === 'video' ? 'Video call connected' : 'Call connected';
            }, 1500);

        } catch(err) {
            toast('Could not access microphone/camera: ' + err.message, 'error', 4000);
            endCall();
        }
    }

    function endCall() {
        if (currentStream) {
            currentStream.getTracks().forEach(t => t.stop());
            currentStream = null;
        }
        document.getElementById('call-overlay').classList.add('hidden');
        document.getElementById('call-overlay').classList.remove('flex');
        document.getElementById('local-video').srcObject = null;
        isMuted = false;
        isCamOff = false;
        toast('Call ended.', 'info', 2000);
        lucide.createIcons();
    }

    function toggleMute() {
        if (!currentStream) return;
        isMuted = !isMuted;
        currentStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        const btn = document.getElementById('btn-mute');
        btn.querySelector('i').setAttribute('data-lucide', isMuted ? 'mic-off' : 'mic');
        btn.style.background = isMuted ? 'rgba(239,68,68,0.2)' : '';
        btn.style.borderColor = isMuted ? 'rgba(239,68,68,0.5)' : '';
        lucide.createIcons();
        toast(isMuted ? 'Muted.' : 'Unmuted.', 'info', 1500);
    }

    function toggleCamera() {
        if (!currentStream) return;
        isCamOff = !isCamOff;
        currentStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
        const btn = document.getElementById('btn-cam');
        btn.querySelector('i').setAttribute('data-lucide', isCamOff ? 'video-off' : 'video');
        btn.style.background = isCamOff ? 'rgba(239,68,68,0.2)' : '';
        btn.style.borderColor = isCamOff ? 'rgba(239,68,68,0.5)' : '';
        lucide.createIcons();
        toast(isCamOff ? 'Camera off.' : 'Camera on.', 'info', 1500);
    }

    // ── MESSAGE SYSTEM ────────────────────────────────────────────
    const AUTO_REPLIES = [
        'Copy that. Proceeding with the protocol.',
        'Signal received. Stand by.',
        'Acknowledged. Keeping the channel open.',
        "Confirmed. What's the next vector?",
        'Roger. Encrypting response now.',
        'Understood. Running verification.',
        'Affirmative. Locked in.',
        'Received. Awaiting further instructions.',
    ];
    let replyIndex = 0;

    function nowTime() {
        return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    }

    function appendMessage(content, side, isSticker) {
        const area = document.getElementById('messages-area');
        const isMe = side === 'me';
        const wrapper = document.createElement('div');
        wrapper.className = 'flex items-end gap-2 msg-bubble ' + (isMe ? 'justify-end' : 'justify-start');

        if (!isMe) {
            const av = document.createElement('div');
            av.className = 'w-7 h-7 rounded-full border border-zinc-800 bg-zinc-900/60 flex items-center justify-center text-[9px] font-bold text-zinc-400 flex-shrink-0 mb-0.5';
            av.textContent = cInit;
            wrapper.appendChild(av);
        }

        const bubble = document.createElement('div');

        if (isSticker) {
            bubble.className = 'flex flex-col items-' + (isMe ? 'end' : 'start') + ' gap-1';
            const stickerBox = document.createElement('div');
            stickerBox.className = 'w-24 h-24 border border-zinc-700 flex items-center justify-center text-2xl font-bold font-mono tracking-widest';
            stickerBox.style.background = content.bg;
            stickerBox.style.color = '#e4e4e7';
            stickerBox.textContent = content.text;
            bubble.appendChild(stickerBox);
        } else {
            bubble.className = isMe
                ? 'max-w-[70%] bg-white text-zinc-900 px-4 py-2.5 text-sm leading-relaxed'
                : 'max-w-[70%] bg-zinc-900/60 border border-zinc-800 text-zinc-100 px-4 py-2.5 text-sm leading-relaxed';
            const msgText = document.createElement('p');
            msgText.textContent = content;
            bubble.appendChild(msgText);
        }

        const ts = document.createElement('span');
        ts.className = 'block text-[9px] mt-1 font-mono ' + (isMe ? 'text-zinc-500 text-right' : 'text-zinc-600');
        ts.textContent = nowTime();
        bubble.appendChild(ts);
        wrapper.appendChild(bubble);
        area.appendChild(wrapper);
        area.scrollTop = area.scrollHeight;
    }

    function sendSticker(s) {
        appendMessage(s, 'me', true);
        triggerReply();
    }

    let typingTimer = null;
    function showTyping() {
        const ti = document.getElementById('typing-indicator');
        ti.classList.remove('hidden');
        ti.classList.add('flex');
        document.getElementById('messages-area').scrollTop = 999999;
    }
    function hideTyping() {
        document.getElementById('typing-indicator').classList.add('hidden');
        document.getElementById('typing-indicator').classList.remove('flex');
    }

    function triggerReply() {
        clearTimeout(typingTimer);
        showTyping();
        typingTimer = setTimeout(function() {
            hideTyping();
            appendMessage(AUTO_REPLIES[replyIndex % AUTO_REPLIES.length], 'other', false);
            replyIndex++;
        }, 1200 + Math.random() * 800);
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const text  = input.value.trim();
        if (!text) return;
        appendMessage(text, 'me', false);
        input.value = '';
        autoGrow(input);
        triggerReply();
    }

    function handleInputKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // ── Init ──────────────────────────────────────────────────────
    buildEmojiGrid();
    buildStickerGrid();
    lucide.createIcons();
</script>
</body>
</html>
